<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <mat-card>
                <mat-card-header>
                    <h2 class="text-center">Login</h2>
                </mat-card-header>
                <mat-card-content>
                    <form [formGroup]="loginForm" (ngSubmit)="login()">

                        <div class="mb-3">
                            <mat-form-field appearance="fill" class="w-100" hideRequiredMarker>
                                <mat-label>Email</mat-label>
                                <input matInput type="email" placeholder="Enter your email" formControlName="email" />
                                <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                                    <small *ngIf="loginForm.get('email')?.errors?.['required']">Email is
                                        required.</small>
                                    <small *ngIf="loginForm.get('email')?.errors?.['emailInvalid']">Please enter a valid
                                        email
                                        address.</small>
                                </mat-error>
                            </mat-form-field>
                        </div>

                        <div class="mb-3">
                            <mat-form-field appearance="fill" class="w-100" hideRequiredMarker>
                                <mat-label>Password</mat-label>
                                <input matInput type="password" placeholder="Enter your password"
                                    formControlName="password" />
                                <mat-error
                                    *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                                    <small *ngIf="loginForm.get('password')?.errors?.['required']">Password is
                                        required.</small>
                                </mat-error>
                            </mat-form-field>
                        </div>

                        <button mat-stroked-button color="primary" class="w-100 d-flex align-items-center justify-content-center" type="submit"
                            [disabled]="(loading$ | async) || loginForm.invalid">
                            <ng-container *ngIf="loading$ | async; else buttonText">
                                <div class="d-flex align-items-center">
                                    <mat-spinner diameter="20" class="me-2"></mat-spinner> Loading...
                                </div>
                            </ng-container>
                            <ng-template #buttonText>Login</ng-template>
                        </button>
                        
                        <mat-error *ngIf="errorMessage$ | async as errorMessage" class="mt-3">{{ errorMessage }}</mat-error>

                    </form>
                </mat-card-content>
            </mat-card>
        </div>
    </div>
</div>
