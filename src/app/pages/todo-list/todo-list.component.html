<div class="container-fluid bg-light">
    <div class="container bg-light p-5 rounded" style="position: relative; height: 100vh;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-2">Todo App</h1>
                <p class="text-muted medium mb-0">
                    Today: {{ today | date: 'fullDate' }}
                </p>
            </div>

            <div class="d-flex gap-2">
                <form (ngSubmit)="applySearchFilters()" class="d-flex">
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="Search by title" [(ngModel)]="searchTerm"
                            name="search" />
                    </div>
                </form>

                <div class="input-group">
                    <input type="date" class="form-control" [(ngModel)]="startDateFilter" name="startDate"
                        (change)="applyFilters()" />
                    <button type="button" class="btn btn-secondary" (click)="clearDateFilter()">
                        X
                    </button>
                </div>
            </div>
        </div>

        <ul class="list-group">
            <li *ngFor="let todo of paginatedTodos; let i = index"
                class="list-group-item d-flex justify-content-between align-items-center mb-2 rounded-3 p-3"
                [class.completed]="todo.completed">

                <div class="d-flex justify-content-between align-items-center gap-2">
                    <input type="checkbox" (click)="toggleComplete(todo)" [checked]="todo.completed" class="checkbox" />
                    <span [ngClass]="{ 'text-decoration-line-through': todo.completed, 'cursor-pointer': true }"
                        (click)="editTodo(i)">
                        {{ todo.name }}
                    </span>
                </div>
                <div class="d-flex flex-row align-items-center">
                    <div class="me-2">
                        <span class="badge rounded-pill bg-light text-dark">
                            {{ todo.date | date:'dd/MM' }}
                        </span>
                    </div>
                    <button class="btn btn-danger btn-sm" (click)="deleteTodo(i)" aria-label="Delete Todo">
                        X
                    </button>
                </div>
            </li>
        </ul>

        <app-pagination [totalItems]="this.filteredTodos.length"></app-pagination>

        <!-- Popup Form -->
        <div class="backdrop" *ngIf="showForm" (click)="cancelForm()"></div>
        <div class="form-container" *ngIf="showForm">
            <app-todo-form [currentTodo]="currentTodo" 
                    (addTodoEvent)="addTodo($event)"
                    (editTodoEvent)="updateTodo($event)" 
                    (cancelEvent)="cancelForm()"></app-todo-form>
        </div>

        <button class="btn btn-success position-absolute rounded-pill" style="bottom: 20px; left: 50%; transform: translateX(-50%); 
                    width: 20%; text-align: center; padding-left: 20px;" (click)="toggleForm()">
            Create a new task
        </button>

        <app-confirm *ngIf="showConfirmDelete" [todoName]="todoToDelete?.name ?? ''" (confirmDelete)="confirmDelete()"
            (cancelDelete)="cancelDelete()">
        </app-confirm>
    </div>
</div>
