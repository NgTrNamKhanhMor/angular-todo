<div class="container-fluid bg-light">
    <div class="container bg-light p-5 rounded" style="position: relative; height: 100vh;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center gap-3">
                <!-- Title Section -->
                <div>
                    <h1 class="mb-2">Todo App</h1>
                    <p class="text-muted medium mb-0">
                        Today: {{ today | date: 'fullDate' }}
                    </p>
                </div>

                <!-- Square Button for Creating a New Task -->
                <button class="btn btn-outline-primary rounded-3 d-flex align-items-center justify-content-center"
                    style="width: 80px; height: 80px;" (click)="openForm()">
                    <i class="fa-solid fa-plus fa-2x"></i>
                </button>
            </div>

            <div class="d-flex align-items-center gap-2">
                <!-- Search Form -->
                <form (ngSubmit)="applySearchFilters()" class="d-flex">
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="Search by title" [(ngModel)]="searchTerm"
                            name="search" />
                    </div>
                </form>

                <!-- Date Filter with Clear Button -->
                <div class="input-group">
                    <input type="date" class="form-control" [(ngModel)]="startDateFilter" name="startDate"
                        (change)="applyFilters()" />
                    <button type="button" class="btn btn-secondary" (click)="clearDateFilter()">
                        X
                    </button>
                </div>

                <!-- Logout Button -->
                <button class="btn btn-outline-secondary" (click)="logout()">
                    <i class="fa fa-sign-out"></i>
                </button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div *ngIf="loading" class="d-flex justify-content-center my-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Todo List -->
        <ul *ngIf="!loading" class="list-group">
            <li *ngFor="let todo of paginatedTodos; let i = index"
                class="list-group-item d-flex justify-content-between align-items-center mb-2 rounded-3 p-3"
                [class.completed]="todo.completed">

                <div class="d-flex justify-content-between align-items-center gap-2">
                    <input type="checkbox" (click)="toggleComplete(todo)" [checked]="todo.completed" class="checkbox" />
                    <span [ngClass]="{ 'text-decoration-line-through': todo.completed, 'cursor-pointer': true }"
                        (click)="editTodo(todo.id)">
                        {{ todo.name }}
                    </span>
                </div>
                <div class="d-flex flex-row align-items-center">
                    <div class="me-2">
                        <span class="badge rounded-pill bg-light text-dark">
                            {{ todo.date | date:'dd/MM' }}
                        </span>
                    </div>
                    <button class="btn btn-outline-danger btn-sm" (click)="deleteTodo(i)" aria-label="Delete Todo">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </li>
        </ul>

        <!-- Pagination Component -->
        <app-pagination [totalItems]="filteredTodos.length"></app-pagination>
    </div>
</div>
