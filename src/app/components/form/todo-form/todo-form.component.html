<div class="modal show" id="taskModal" tabindex="1050" role="dialog" style="display: block;">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="taskModalLabel">Add New Task</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cancel()" [disabled]="loading">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form (ngSubmit)="onSubmit()" #myForm="ngForm">
                    <!-- Task Name Input -->
                    <input type="text" class="form-control mb-2" placeholder="Add a new task" name="name" ngModel
                        required #taskName="ngModel" />
                    <div>
                        <small *ngIf="taskName.invalid && taskName.touched">Name is required</small>
                    </div>

                    <!-- Start Date Input -->
                    <input type="date" class="form-control mb-2" placeholder="Start Date" name="date" ngModel required
                        #startDate="ngModel" />
                    <div>
                        <small *ngIf="startDate.invalid && startDate.touched">Date is required</small>
                    </div>

                    <!-- Submit Button -->
                    <button class="btn btn-primary w-100" type="submit" [disabled]="loading">
                        <span *ngIf="!loading">Save changes</span>
                        <span *ngIf="loading">Loading...</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
