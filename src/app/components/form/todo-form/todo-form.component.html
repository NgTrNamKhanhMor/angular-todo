<h2 mat-dialog-title>{{ data.currentTodo ? 'Edit Task' : 'Add New Task' }}</h2>

<form [formGroup]="todoForm" (ngSubmit)="onSubmit()" class="form-container">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-100" hideRequiredMarker>
    <mat-label >Task Name</mat-label>
    <input matInput placeholder="Enter task name" formControlName="name" required />
    <mat-error *ngIf="name?.hasError('required')">Name is required.</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100" hideRequiredMarker>
    <mat-label >Start Date</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="date" required />
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
    <mat-error *ngIf="date?.hasError('required')">Date is required.</mat-error>
  </mat-form-field>
</mat-dialog-content>


  <mat-dialog-actions align="end" class="mat-modal-footer">
    <button mat-raised-button type="submit" [disabled]="loading">
      <span *ngIf="!loading">Save changes</span>
      <span *ngIf="loading">Loading...</span>
    </button>
  </mat-dialog-actions>
</form>
