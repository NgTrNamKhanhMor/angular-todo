<mat-dialog-content class="mat-modal-content" cdkFocusInitial>
  <h2 mat-dialog-title>Delete Confirmation</h2>
  <div mat-dialog-content class="mat-modal-body">
    <p>Are you sure you want to delete the task "{{ data.todoName }}"?</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="mat-modal-footer">
  <button mat-raised-button (click)="confirm()">Delete</button>
</mat-dialog-actions>
